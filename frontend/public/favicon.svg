<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nexo-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Vibrant Electric Blue Gradient -->
    <linearGradient id="nexo-fav-primary" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- High-light Cyan Gradient -->
    <linearGradient id="nexo-fav-highlight" x1="10" y1="10" x2="34" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Deep Cobalt Indigo Gradient -->
    <linearGradient id="nexo-fav-deep" x1="30" y1="30" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="nexo-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3b82f6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- High-Tech Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#nexo-fav-bg)" />
  <rect width="64" height="64" rx="16" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Bold Geometric NEXO 'N' Monogram -->
  <g filter="url(#nexo-fav-glow)">
    <!-- Left Vertical Pillar -->
    <path
      d="M14 50V20L23.5 13V43L14 50Z"
      fill="url(#nexo-fav-primary)"
    />

    <!-- Left Top Apex Bevel -->
    <path
      d="M14 20L23.5 13L32 19L22.5 26.5L14 20Z"
      fill="url(#nexo-fav-highlight)"
    />

    <!-- Diagonal Dynamic Ribbon Connector -->
    <path
      d="M22.5 26.5L32 19L41.5 44L32 51L22.5 26.5Z"
      fill="url(#nexo-fav-primary)"
    />

    <!-- Right Vertical Pillar - Light Face -->
    <path
      d="M41.5 21V50L32 43.5V14.5L41.5 21Z"
      fill="url(#nexo-fav-highlight)"
    />

    <!-- Right Vertical Pillar - Dark Face -->
    <path
      d="M41.5 21L50 14V43.5L41.5 50V21Z"
      fill="url(#nexo-fav-deep)"
    />

    <!-- Central Illuminated Core -->
    <polygon
      points="32,27.5 36.5,33.5 32,39.5 27.5,33.5"
      fill="#38bdf8"
      opacity="0.95"
    />

    <!-- Crisp Center Light Specular -->
    <circle cx="32" cy="33.5" r="1.8" fill="#ffffff" />
  </g>
</svg>
