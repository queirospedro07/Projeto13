services:
  # ─────────────────────────────────────────────
  # Backend — Node.js API + Socket.IO
  # ─────────────────────────────────────────────
  - type: web
    name: nexo-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 24h
      # Definir manualmente no dashboard do Render:
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # URL do frontend Vercel (para CORS)
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
