services:
  # ─────────────────────────────────────────────
  # Backend — Node.js API + Socket.IO
  # ─────────────────────────────────────────────
  - type: web
    name: nexo-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 24h
      # Definir manualmente no dashboard do Render:
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─────────────────────────────────────────────
  # Frontend — React + Vite (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: nexo-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Apontar para a URL do backend após deploy — definir no dashboard
      - key: VITE_API_URL
        sync: false
