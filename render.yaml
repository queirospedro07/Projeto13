services:
  - type: web
    name: learnspace-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --include=dev && npm rebuild better-sqlite3 && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_PATH
        value: ./data/learnspace.db
