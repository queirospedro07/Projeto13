name: nexo
services:
  database:
    image: postgres:17-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    env_file: .runtime/postgres.env
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - nexo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  nexo-postgres-data:
    external: true
